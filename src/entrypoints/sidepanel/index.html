<!doctype html>
<html lang="en" id="html-root">
<head>
  <meta charset="utf-8" />
  <title data-i18n="settingsTitle">FastWeb — settings</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/panel.css" />
</head>
<body>
  <!-- Icon sprite -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" id="icon-sprite">
    <symbol id="ico-globe" viewBox="0 0 20 20"><path fill="currentColor" d="M10 0C4.48 0 0 4.48 0 10s4.48 10 10 10 10-4.48 10-10S15.52 0 10 0M2 10c0-.61.08-1.21.21-1.78L6.99 13v1c0 1.1.9 2 2 2v1.93A8.01 8.01 0 0 1 2 10m13.89 5.4A1.99 1.99 0 0 0 14 14h-1v-3c0-.55-.45-1-1-1H6V8h2c.55 0 1-.45 1-1V5h2c1.1 0 2-.9 2-2v-.41A7.998 7.998 0 0 1 18 10c0 2.08-.8 3.97-2.11 5.4"/></symbol>
    <symbol id="ico-cog" viewBox="0 0 20 20"><path fill="currentColor" d="M9.73 13.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7m7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46a.49.49 0 0 0-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98L12.23.42a.506.506 0 0 0-.5-.42h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L2.3 9c-.04.34-.07.67-.07 1s.03.65.07.97L.19 12.63c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64z"/></symbol>
    <symbol id="ico-panel" viewBox="0 0 20 20"><path fill="currentColor" d="M2 3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1zm5 1h11v12H7zm-1 0v12H2V4z"/></symbol>
    <symbol id="ico-bolt" viewBox="0 0 20 20"><path fill="currentColor" d="M10.91 0 4.544 12.727H9.09V20l6.364-12.727h-4.546z"/></symbol>
    <symbol id="ico-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="ico-sidebar" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><line x1="9" y1="3" x2="9" y2="21" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="ico-chevron" viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ico-x" viewBox="0 0 20 20"><path d="M17 4.41 15.59 3 10 8.59 4.41 3 3 4.41 8.59 10 3 15.59 4.41 17 10 11.41 15.59 17 17 15.59 11.41 10z" fill="currentColor"/></symbol>
  </svg>

  <div class="panel">
    <!-- Header -->
    <header class="panel__header">
      <div class="panel__header-left">
        <a href="https://fastweb.cam" target="_blank" rel="noreferrer" aria-label="FastWeb">
          <img class="panel__brand-icon" src="/icons/brand.svg" alt="" />
        </a>
        <h1 class="panel__title">FastWeb</h1>
      </div>
      <div class="panel__actions">
        <button class="btn-icon" type="button" data-action="toggle-theme" data-i18n-title="themeBtn" title="Toggle theme">
          <span class="ah-icon"><svg><use href="#ico-moon"/></svg></span>
        </button>
      </div>
    </header>

    <!-- Tab navigation -->
    <nav class="panel__nav">
      <button class="nav-tab is-active" data-tab="domains">
        <svg class="nav-tab__icon"><use href="#ico-globe"/></svg>
        <span data-i18n="tabDomains">Domains</span>
      </button>
      <button class="nav-tab" data-tab="preferences">
        <svg class="nav-tab__icon"><use href="#ico-cog"/></svg>
        <span data-i18n="tabPrefs">Settings</span>
      </button>
    </nav>

    <!-- Tier 2: collapsible controls -->
    <div class="panel__controls" id="panelControls">
      <div class="actions-row">
        <button id="exportBtn" type="button" class="btn btn--outline" data-i18n="exportBtn">Export</button>
        <button id="importBtn" type="button" class="btn btn--outline" data-i18n="importBtn">Import</button>
        <button id="ah-load-bundle" type="button" class="btn btn--ghost" data-i18n="loadBundleBtn">Load bundle</button>
        <button id="ah-delete-bundle" type="button" class="btn btn--outline-danger" data-i18n="deleteBundleBtn">Delete bundle</button>
      </div>
      <div id="ah-inline-msg" class="inline-msg" role="status" aria-live="polite"></div>
      <div class="field">
        <div class="input-wrap" id="searchWrap">
          <input id="search" class="input" placeholder="Type to filter..." data-i18n-placeholder="searchPlaceholder" aria-label="Filter domains" data-i18n-aria-label="searchLabel" />
          <button type="button" class="input-wrap__clear" id="searchClear" aria-label="Clear">
            <svg aria-hidden="true" width="20" height="20"><use href="#ico-x"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Views -->
    <main class="panel__body">

      <!-- =============== DOMAINS VIEW =============== -->
      <section class="view" data-view-content="domains">

        <!-- Add domain form -->
        <div class="domain-form">
          <div class="field">
            <label class="field__label" for="domain" data-i18n="domainLabel">Domain</label>
            <input id="domain" class="input" placeholder="example.com →" data-i18n-placeholder="domainPlaceholder" />
          </div>
          <div class="field">
            <label class="field__label" for="alts" data-i18n="altsLabel">Official alternates (comma-separated)</label>
            <div class="domain-form__row">
              <div class="domain-form__field">
                <input id="alts" class="input" placeholder="example.org, example.net" data-i18n-placeholder="altsPlaceholder" />
              </div>
              <button id="add" type="button" class="btn btn--primary" data-i18n="addBtn">Add</button>
            </div>
          </div>
        </div>

        <!-- Domain list -->
        <div class="domain-list" id="list"></div>

        <!-- Bookmarks -->
        <div class="bookmark-section is-hidden" id="bmSection">
          <div class="section-title" data-i18n="bookmarksHeading">Related bookmarks</div>
          <div id="bmResults" class="pill-row"></div>
        </div>
      </section>

      <!-- =============== PREFERENCES VIEW =============== -->
      <section class="view" data-view-content="preferences" hidden>
        <div class="prefs-grid">

          <!-- Sensitivity -->
          <div class="range">
            <span class="range__label" data-i18n="prefSensitivity">Sensitivity (min brand length)</span>
            <div class="range__control">
              <input id="ah-minBrand" class="range__slider" type="range" min="1" max="10" step="1" value="2" />
              <span id="ah-minBrand-value" class="range__value">2</span>
            </div>
          </div>

          <!-- Toggles -->
          <div class="toggle-group">
            <label class="toggle">
              <span class="toggle__text" data-i18n="prefUnicode">Unicode tokenization</span>
              <span class="toggle__control">
                <input id="prefUnicode" type="checkbox" checked />
                <span class="toggle__track" aria-hidden="true"></span>
              </span>
            </label>
            <label class="toggle">
              <span class="toggle__text" data-i18n="prefShowBookmarks">Bookmarks in search</span>
              <span class="toggle__control">
                <input id="prefShowBookmarks" type="checkbox" checked />
                <span class="toggle__track" aria-hidden="true"></span>
              </span>
            </label>
            <label class="toggle">
              <span class="toggle__text" data-i18n="prefShowBadge">Tip counter badge</span>
              <span class="toggle__control">
                <input id="prefShowBadge" type="checkbox" checked />
                <span class="toggle__track" aria-hidden="true"></span>
              </span>
            </label>
            <label class="toggle">
              <span class="toggle__text" data-i18n="prefPrefetch">Acceleration mode</span>
              <span class="toggle__control">
                <input id="prefPrefetch" type="checkbox" />
                <span class="toggle__track" aria-hidden="true"></span>
              </span>
            </label>

            <!-- Prefetch sub-options -->
            <div id="prefetch-options" class="prefetch-options" hidden>
              <div class="range">
                <span class="range__label" data-i18n="prefPrefetchTopN">Links to warm up (Top N)</span>
                <div class="range__control">
                  <input id="ah-prefetchTopN" class="range__slider" type="range" min="1" max="15" step="1" value="5" />
                  <span id="ah-prefetchTopN-value" class="range__value">5</span>
                </div>
              </div>
              <div class="range">
                <span class="range__label" data-i18n="prefPrefetchDelay">Hover delay (ms)</span>
                <div class="range__control">
                  <input id="ah-prefetchDelay" class="range__slider" type="range" min="50" max="2000" step="50" value="200" />
                  <span id="ah-prefetchDelay-value" class="range__value">200</span>
                </div>
              </div>
              <p class="panel-note" data-i18n="prefPrefetchWarning">
                Optional. Warms up DNS/TCP/TLS for Top N results on hover (SERP only). May generate extra network traffic. No pages are downloaded.
              </p>
            </div>
          </div>

        </div>

          <!-- Panel display mode -->
          <div class="panel-mode">
            <div class="panel-mode__label" data-i18n="prefPanelMode">SERP panel</div>
            <div class="dropdown" id="panelModeDropdown">
              <button class="btn-chip" type="button" aria-haspopup="menu" aria-expanded="false">
                <svg class="btn-chip__icon" id="panelModeChipIcon"><use href="#ico-panel"/></svg>
                <span class="btn-chip__label" id="panelModeChipLabel" data-i18n="panelModePanel">Auto panel</span>
                <span class="btn-chip__chevron"><svg><use href="#ico-chevron"/></svg></span>
              </button>
              <div class="dropdown__menu" role="menu">
                <button class="dropdown__item is-active" data-mode="panel" data-icon="ico-panel" type="button" role="menuitem">
                  <svg class="dropdown__icon"><use href="#ico-panel"/></svg>
                  <span data-i18n="panelModePanel">Auto panel</span>
                </button>
                <button class="dropdown__item" data-mode="icon" data-icon="ico-bolt" type="button" role="menuitem">
                  <svg class="dropdown__icon"><use href="#ico-bolt"/></svg>
                  <span data-i18n="panelModeIcon">Icon only</span>
                </button>
              </div>
            </div>
          </div>

        <!-- Store link -->
        <a id="rate-link" class="btn btn--ghost" hidden target="_blank" rel="noreferrer" style="margin-top: var(--space-4)">
          <img id="rate-icon" width="16" height="16" alt="" style="vertical-align: -2px; margin-inline-end: 4px" />
          <span data-i18n="rateBtn">Rate</span>
        </a>

        <!-- Community links -->
        <div class="community-links">
          <a class="btn btn--ghost" href="https://github.com/investblog/fastweb/issues" target="_blank" rel="noreferrer">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M10 0a10 10 0 0 0-3.162 19.487c.5.088.687-.212.687-.475 0-.237-.012-1.025-.012-1.862-2.513.462-3.163-.613-3.363-1.175a3.64 3.64 0 0 0-1.025-1.413c-.35-.187-.85-.65-.013-.662a2 2 0 0 1 1.538 1.025 2.135 2.135 0 0 0 2.912.825 2.1 2.1 0 0 1 .638-1.338c-2.225-.25-4.55-1.112-4.55-4.937a3.9 3.9 0 0 1 1.025-2.688 3.6 3.6 0 0 1 .1-2.65s.837-.262 2.75 1.025a9.43 9.43 0 0 1 5 0c1.912-1.3 2.75-1.025 2.75-1.025a3.6 3.6 0 0 1 .1 2.65A3.87 3.87 0 0 1 16.4 9.475c0 3.837-2.338 4.687-4.562 4.937a2.37 2.37 0 0 1 .674 1.85c0 1.338-.012 2.413-.012 2.75 0 .263.187.575.687.475A10.005 10.005 0 0 0 10 0" fill="currentColor"/></svg>
            <span data-i18n="reportIssueBtn">Report issue</span>
          </a>
          <a class="btn btn--ghost" href="https://t.me/+ws8hFJUkKtsxZTYy" target="_blank" rel="noreferrer">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 24c6.627 0 12-5.373 12-12S18.627 0 12 0 0 5.373 0 12s5.373 12 12 12" fill="url(#tg-grad)"/><path d="M17.989 7.036c.106-.69-.55-1.235-1.164-.966L4.598 11.438c-.44.194-.408.86.049 1.006l2.521.803a1.63 1.63 0 0 0 1.423-.216l5.685-3.928c.171-.118.358.125.212.276l-4.092 4.22c-.397.409-.319 1.102.159 1.401l4.581 2.873c.514.323 1.175-.001 1.271-.622z" fill="#fff"/><defs><linearGradient id="tg-grad" x1="12" y1="0" x2="12" y2="24" gradientUnits="userSpaceOnUse"><stop stop-color="#37bbfe"/><stop offset="1" stop-color="#007dbb"/></linearGradient></defs></svg>
            <span data-i18n="telegramBtn">Telegram</span>
          </a>
        </div>
      </section>

    </main>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
